# iOS 模拟器验收（不需要 Mac、不需要 Apple 开发者账号、不需要 iPhone）
#
# 为什么有用：开发机是 Linux，既不能 flutter build ios，也不能跑 iOS 模拟器。
# GitHub Actions 的 macOS runner 免费（public 仓库不限时长），能在真 macOS + 真 Xcode 上：
#   1. 编译 iOS 模拟器版（不需要签名）
#   2. 装进模拟器并真的启动
#   3. 截图当证据（artifact 下载）
# 能验：iOS 能否构建、启动是否崩溃、SQLite 能否打开（模拟器自带 libsqlite3）、界面渲染（含中文）。
# 不能验：真机性能、锁屏/免打扰、上架签名与 TestFlight。
#
# 用法：把仓库镜像到 GitHub（public）→ push 自动跑，或在 Actions 页面 Run workflow。

name: iOS 模拟器验收

on:
  push:
    branches: [master]
    paths:
      - 'app_flutter/**'
      - 'shared/**'
      - '.github/workflows/ios-sim.yml'
  workflow_dispatch:

permissions:
  contents: write   # 失败时要把日志推到 ci-logs 分支

jobs:
  ios-simulator:
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 编译 iOS 模拟器版（不需要签名）
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign --debug 2>&1 | tee build-ios.log

      - name: 启动模拟器、安装、运行、截图
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "找不到可用 iPhone 模拟器"; exit 1; fi
          echo "模拟器 $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/ios/iphonesimulator/Runner.app
          ls -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          # ⚠️ 必须带 --console-pty：App 里的 debugPrint 走 stdout，
          #    `log show --predicate process==Runner` 抓不到它。
          xcrun simctl terminate "$UDID" com.chemica.classout 2>/dev/null || true
          ( xcrun simctl launch --console-pty "$UDID" com.chemica.classout > app.log 2>&1 & )
          sleep 15
          xcrun simctl io "$UDID" screenshot shot-1.png
          sleep 6
          xcrun simctl io "$UDID" screenshot shot-2.png
          echo "--- app.log（App 的 stdout）---"
          cat app.log || true

      - name: 断言 App 真的在跑（而不是启动即崩）
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          # 1) 进程还在（simctl launch 成功不代表没崩）
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q com.chemica.classout; then
            echo "::error::App 启动后进程不在了（很可能是崩溃）"
            exit 1
          fi
          # 2) 没有崩溃报告
          if ls ~/Library/Logs/DiagnosticReports/*.ips >/dev/null 2>&1; then
            echo "::error::发现了崩溃报告"
            ls ~/Library/Logs/DiagnosticReports/*.ips | tail -3
            exit 1
          fi
          echo "App 在运行、无崩溃报告 ✓"

      - name: 从 App 日志断言数据层真的通了（不只是"进程活着"）
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          # 主来源：--console-pty 抓到的 app.log；兜底再查系统日志
          LOG="$(cat app.log 2>/dev/null || true)"
          LOGS="$(xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "Runner"' 2>/dev/null || true)"
          ALL="$LOG$LOGS"
          echo "$ALL" | grep -F '[ClassOUT]' | tail -20 || true
          if ! echo "$ALL" | grep -q '\[ClassOUT\] db opened'; then
            echo "::error::没看到 'db opened' —— SQLite 在 iOS 上没能打开"
            exit 1
          fi
          if ! echo "$ALL" | grep -q '\[ClassOUT\] loaded:'; then
            echo "::error::没看到 'loaded:' —— 数据没读进界面"
            exit 1
          fi
          if echo "$ALL" | grep -qE '\[ClassOUT\] (boot error|load error|boot failed)'; then
            echo "::error::App 报了数据层错误"
            echo "$ALL" | grep -E '\[ClassOUT\] (boot error|load error|boot failed)' | tail -5
            exit 1
          fi
          echo "数据层自检通过 ✓（db opened + loaded，无错误）"

      - name: 抓 App 日志（兜底：崩溃/SQLite 关键字）
        if: always()
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Runner"' 2>/dev/null \
            | grep -iE "error|exception|fatal|sqlite" | tail -60 || true


      - name: 失败时把日志推到 ci-logs 分支（没有 token 也能排查）
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cilog
          cp app_flutter/build-*.log /tmp/cilog/ 2>/dev/null || true
          cp app_flutter/app.log /tmp/cilog/ 2>/dev/null || true
          (cd app_flutter && flutter --version > /tmp/cilog/flutter-version.txt 2>&1 || true)
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp >/dev/null 2>&1 || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/cilog/* . 2>/dev/null || true
          git add -A
          git commit -m "CI 失败日志 run ${{ github.run_number }} (${{ github.workflow }})" >/dev/null
          git push -f origin HEAD:ci-logs

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-shots
          path: |
            app_flutter/shot-1.png
            app_flutter/shot-2.png
            app_flutter/app.log
          if-no-files-found: warn
