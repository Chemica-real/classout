# Android：构建（每次 push 都跑）+ 模拟器运行验证（只在手动触发时跑）
#
# 为什么拆开：
#  - 「能否构建出 APK」是每次改代码都该验的，而且稳定、快；
#  - 「模拟器里跑起来」在 GitHub 的 ubuntu runner 上**很不稳**：
#    reactivecircus/android-emulator-runner 两次都卡住/失败（其中一次跑了 36 分钟没结束）。
#    所以它降级为 workflow_dispatch 手动触发，且 continue-on-error（不挡主流程）。
#    真正的 Android 运行期验证仍然建议用真机（adb install）。
#
# 能验：APK 能否构建（含 core library desugaring、插件、AGP/Kotlin 版本）
# 不能验（自动）：Android 运行时行为（SQLite/通知/后台）—— 需要模拟器或真机

name: Android 构建与运行

on:
  push:
    branches: [master]
    paths:
      - 'app_flutter/**'
      - 'shared/**'
      - '.github/workflows/android-emu.yml'
  workflow_dispatch:

permissions:
  contents: write   # 失败时要把日志推到 ci-logs 分支

jobs:
  build:
    name: 打包 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 打包 debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-apk.log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: classout-debug-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: 失败时收集诊断并推到 ci-logs 分支
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/cilog
          cp app_flutter/build-*.log /tmp/cilog/ 2>/dev/null || true
          (cd app_flutter && flutter --version > /tmp/cilog/flutter-version.txt 2>&1) || true
          (cd app_flutter && flutter doctor -v > /tmp/cilog/flutter-doctor.txt 2>&1) || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp >/dev/null 2>&1 || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/cilog/* . 2>/dev/null || true
          git add -A
          git commit -m "Android 构建失败诊断 run ${{ github.run_number }}" >/dev/null
          git push -f origin HEAD:ci-logs

  emulator:
    name: 模拟器运行验证（手动，可能不稳）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    needs: build
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

      - name: 起模拟器 → 安装 → 启动 → 断言数据层
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app_flutter
          script: |
            adb wait-for-device
            adb shell wm size
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c || true
            adb shell am start -W -n com.chemica.classout/.MainActivity
            sleep 30
            echo "--- ClassOUT 日志 ---"
            adb logcat -d | grep -F '[ClassOUT]' | tail -20 || true
            adb logcat -d | grep -q '\[ClassOUT\] db opened' || { echo "::error::db 没打开"; exit 1; }
            adb logcat -d | grep -q '\[ClassOUT\] loaded:' || { echo "::error::数据没读进来"; exit 1; }
            adb exec-out screencap -p > shot-android.png
            echo "自检通过 ✓"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-shots
          path: app_flutter/shot-android.png
          if-no-files-found: warn
