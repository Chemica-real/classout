name: classout
description: ClassOUT —— 课表 + 待办 + 计划（iOS / Android 用 Dart/Flutter 实现；鸿蒙端是 ArkTS）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 规则层测试用 package:test 写，这样「没装 Flutter 也能 dart test」——
  # 装了 Flutter 之后同一份测试照样能 flutter test（两条路都验过）。
  test: ^1.25.0

flutter:
  uses-material-design: true
