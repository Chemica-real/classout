name: classout
description: ClassOUT —— 课表 + 待办 + 计划（iOS / Android 用 Dart/Flutter 实现；鸿蒙端是 ArkTS）
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 通知插件的 web 实现要用它（Flutter SDK 自带，不额外下载）
  flutter_web_plugins:
    sdk: flutter
  # SQLite（iOS 自带 libsqlite3，直接 FFI 打开；Android 端以后加 sqlite3_flutter_libs）
  sqlite3: ^2.4.0
  # 只有 io 端用：取 App 数据目录（web 端不走这条路）
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  # Android 需要它来打包 libsqlite3（系统库不在公开 NDK 里，不能指望）。
  # ⚠️ 别升到 0.6.x：那是官方 EOL 的空壳（"no longer does anything"），
  #    它对应的迁移目标是 sqlite3 3.x 的 native assets 方案；
  #    我们还在 sqlite3 2.4，所以用 0.5.x 这条线。
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 规则层测试用 package:test 写，这样「没装 Flutter 也能 dart test」——
  # 装了 Flutter 之后同一份测试照样能 flutter test（两条路都验过）。
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # 演示用备份：通用演示数据（高数/英语/计导/线代），不含任何个人信息
    - assets/demo_backup.json
    # 建库用的权威 DDL（从 ../shared/schema.sql 复制而来，db_test 会校验两边一致）
    - assets/schema.sql
  fonts:
    # 中文字体子集（只含项目里用到的 1440 个字，359 KB）
    # 为什么需要：Flutter 的 web 版用 CanvasKit 渲染，包里没有中文字形时它会去
    # fonts.gstatic.com 下载兜底 —— 国内网络连不上，结果就是满屏豆腐块。
    - family: ClassOutCJK
      fonts:
        - asset: assets/fonts/ClassOutCJK.ttf
